# Publica a pasta santino-prime-meats no GitHub Pages a cada push na main.
# Pré-requisito (uma vez): Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'santino-prime-meats/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela uma que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: santino-prime-meats
      - id: deployment
        uses: actions/deploy-pages@v4
